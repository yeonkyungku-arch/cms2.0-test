<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 찾기 — DOOH CMS 2.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #24292E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 400px;
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
    }
    .logo-block { text-align: center; margin-bottom: 28px; }
    .logo-mark { font-size: 32px; font-weight: 700; color: #58C65D; line-height: 1; letter-spacing: -0.5px; }
    .logo-sub { font-size: 13px; color: #9EA5AD; margin-top: 6px; }
    .page-title {
      font-size: 18px;
      font-weight: 700;
      color: #24292E;
      text-align: center;
      margin-bottom: 8px;
    }
    .page-desc {
      font-size: 13px;
      color: #9EA5AD;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #E5E7EA;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #9EA5AD;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab.active { color: #58C65D; border-bottom-color: #58C65D; }
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field-label { font-size: 13px; color: #9EA5AD; }
    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #CED2D6;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      color: #24292E;
      outline: none;
    }
    .field-input:focus { border-color: #58C65D; }
    .field-input::placeholder { color: #CED2D6; }
    .btn-submit {
      width: 100%;
      height: 48px;
      background: #58C65D;
      color: #fff;
      border: 1px solid #58C65D;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s;
    }
    .btn-submit:hover { background: #fff; color: #58C65D; }
    /* Result box */
    .result-box {
      display: none;
      background: #F6F7F9;
      border: 1px solid #E5E7EA;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: #24292E;
      line-height: 1.6;
    }
    .result-box .result-id {
      font-size: 18px;
      font-weight: 700;
      color: #2D84ED;
      margin: 8px 0;
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    .link-row a { font-size: 12px; color: #9EA5AD; text-decoration: none; transition: color 0.2s; }
    .link-row a:hover { color: #58C65D; }
    .link-sep { font-size: 12px; color: #E5E7EA; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-block">
      <div class="logo-mark">DL</div>
      <div class="logo-sub">DOOH CMS 2.0</div>
    </div>
    <div class="page-title">아이디 찾기</div>
    <div class="page-desc">가입 시 등록한 이메일 또는 휴대폰 번호로<br>아이디를 확인할 수 있습니다.</div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('email')">이메일로 찾기</div>
      <div class="tab" onclick="switchTab('phone')">휴대폰으로 찾기</div>
    </div>

    <!-- Email tab -->
    <div class="tab-content active" id="tab-email">
      <form onsubmit="showResult(event)">
        <div class="field-group">
          <label class="field-label">이메일</label>
          <input class="field-input" type="email" placeholder="가입 시 등록한 이메일 주소">
        </div>
        <div class="field-group">
          <label class="field-label">이름</label>
          <input class="field-input" type="text" placeholder="이름을 입력하세요">
        </div>
        <button type="submit" class="btn-submit">아이디 찾기</button>
      </form>
    </div>

    <!-- Phone tab -->
    <div class="tab-content" id="tab-phone">
      <form onsubmit="showResult(event)">
        <div class="field-group">
          <label class="field-label">휴대폰 번호</label>
          <input class="field-input" type="tel" placeholder="- 없이 숫자만 입력">
        </div>
        <div class="field-group">
          <label class="field-label">이름</label>
          <input class="field-input" type="text" placeholder="이름을 입력하세요">
        </div>
        <button type="submit" class="btn-submit">인증번호 발송</button>
      </form>
    </div>

    <!-- Result -->
    <div class="result-box" id="resultBox">
      <div style="color:#596066;font-size:13px;">조회된 아이디입니다.</div>
      <div class="result-id">dooh_operator01</div>
      <div style="font-size:12px;color:#9EA5AD;">가입일: 2024년 03월 15일</div>
    </div>

    <div class="link-row">
      <a href="login">로그인</a>
      <span class="link-sep">|</span>
      <a href="find-pw">비밀번호 찾기</a>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'email') || (i === 1 && tab === 'phone'));
      });
      document.getElementById('tab-email').classList.toggle('active', tab === 'email');
      document.getElementById('tab-phone').classList.toggle('active', tab === 'phone');
      document.getElementById('resultBox').style.display = 'none';
    }
    function showResult(e) {
      e.preventDefault();
      document.getElementById('resultBox').style.display = 'block';
    }
  </script>
<a href="scenario-guide" class="sg-float-btn" style="position:fixed;bottom:24px;right:24px;z-index:400;background:#24292E;color:#fff;border:none;border-radius:24px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,0.2);text-decoration:none;">📋 시나리오 가이드</a>
</body>
</html>

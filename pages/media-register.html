<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미디어 등록 — CMS 2.0</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    .content { padding-top: 0; }

    /* Form section */
    .form-section { margin-bottom: 28px; }
    .form-section-title {
      font-size: 15px; font-weight: 500; color: #000;
      border-bottom: 1px solid #EBEEF5; padding-bottom: 10px; margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      row-gap: 14px;
      align-items: center;
    }
    .form-grid .label {
      font-size: 14px; color: #909399; text-align: right; padding-right: 20px;
    }
    .form-grid .value { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .req { color: #FF0000; }

    /* Connection status badge */
    .conn-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; color: #52B65C; font-weight: 500;
    }
    .conn-badge::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; background: #52B65C;
    }

    /* Textarea */
    .inp-area { height: 72px; width: 100%; padding: 8px; font-size: 14px; font-family: inherit; }
  </style>
</head>
<body>

  <!-- GNB -->
  <aside class="gnb">
    <div class="gnb-logo">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none">
        <rect width="50" height="50" rx="8" fill="rgba(0,0,0,0.08)"/>
        <text x="25" y="32" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="700" fill="#fff">DL</text>
      </svg>
    </div>
    <nav class="gnb-nav">
      <a href="dashboard.html">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor">
          <rect x="2" y="2" width="8" height="8" rx="1"/><rect x="12" y="2" width="8" height="8" rx="1"/>
          <rect x="2" y="12" width="8" height="8" rx="1"/><rect x="12" y="12" width="8" height="8" rx="1"/>
        </svg>대시보드
      </a>
      <a href="#" class="active">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="18" height="12" rx="2"/>
          <path d="M8 18h6M11 16v2" stroke-linecap="round"/>
        </svg>미디어
      </a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="16" height="11" rx="1.5"/><path d="M6 7V5a1 1 0 011-1h8a1 1 0 011 1v2"/></svg>미디어그룹</a>
      <a href="contents.html"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7l-4-5z"/><path d="M13 2v5h4"/><line x1="8" y1="11" x2="14" y2="11" stroke-linecap="round"/><line x1="8" y1="14" x2="12" y2="14" stroke-linecap="round"/></svg>콘텐츠</a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="16" height="15" rx="2"/><path d="M3 9h16M8 2v3M14 2v3" stroke-linecap="round"/><rect x="6" y="13" width="2" height="2" rx=".5" fill="currentColor" stroke="none"/><rect x="10" y="13" width="2" height="2" rx=".5" fill="currentColor" stroke="none"/><rect x="14" y="13" width="2" height="2" rx=".5" fill="currentColor" stroke="none"/></svg>스케줄</a>
      <a href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,16 6,10 10,13 14,7 20,11"/></svg>모니터링</a>
      <div class="gnb-divider"></div>
      <a href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h7l9 9a2 2 0 010 2.83l-3.17 3.17a2 2 0 01-2.83 0L3 9V3z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>태그검색</a>
    </nav>
  </aside>

  <!-- Topbar -->
  <header class="topbar" id="topbar">
    <div class="topbar-top">
      <div class="topbar-search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4" stroke="#9EA5AD" stroke-width="1.4"/><line x1="9.5" y1="9.5" x2="13" y2="13" stroke="#9EA5AD" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" placeholder="검색">
      </div>
      <div class="topbar-user">
        <div class="topbar-icon-btn">
          <div class="dot-badge"></div>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5.5 5.5 0 00-5.5 5.5V11l-1.5 2h14L14.5 11V7.5A5.5 5.5 0 009 2z" stroke="#9EA5AD" stroke-width="1.3"/><path d="M7 14a2 2 0 004 0" stroke="#9EA5AD" stroke-width="1.3"/></svg>
        </div>
        <div class="topbar-profile" id="profileTrigger" onclick="toggleProfile(event)">
          <div class="topbar-profile-info">
            <div class="topbar-profile-name">관리자</div>
            <div class="topbar-profile-org">DOOH Service</div>
          </div>
          <span class="topbar-caret">▾</span>
          <div class="profile-dropdown" id="profileDropdown">
            <a href="#">내 정보</a>
            <a href="#">비밀번호 변경</a>
            <a href="login.html" class="logout">로그아웃</a>
          </div>
        </div>
      </div>
    </div>
    <div class="topbar-bottom">
      <span class="header-title">미디어 관리</span>
      <ul class="header-nav">
        <li><a href="#">미디어 목록</a></li>
        <li class="active"><a href="#">미디어 등록</a></li>
      </ul>
    </div>
  </header>

  <!-- Content -->
  <main class="content" id="mainContent">

    <!-- Basic Info -->
    <div class="article">
      <div class="article-header">
        <span class="article-title">기본 정보</span>
      </div>
      <div class="article-inner">
        <div class="form-section">
          <div class="form-grid">
            <div class="label">미디어명 <span class="req">*</span></div>
            <div class="value"><input type="text" class="inp" style="width:320px;" placeholder="미디어명을 입력하세요"></div>

            <div class="label">미디어 그룹</div>
            <div class="value">
              <select class="sel" style="width:200px;"><option value="">선택</option><option>서울 A 그룹</option><option>경기 B 그룹</option></select>
            </div>

            <div class="label">설치 위치 <span class="req">*</span></div>
            <div class="value">
              <input type="text" class="inp" style="width:280px;" placeholder="주소 검색">
              <button class="btn btn-plain btn-sm">주소 검색</button>
            </div>

            <div class="label">상세 위치</div>
            <div class="value"><input type="text" class="inp" style="width:320px;" placeholder="건물명, 층, 위치 등"></div>

            <div class="label">운영 시간</div>
            <div class="value" style="gap:6px;">
              <input type="time" class="inp" value="08:00" style="width:110px;">
              <span class="text-muted">~</span>
              <input type="time" class="inp" value="22:00" style="width:110px;">
            </div>

            <div class="label">메모</div>
            <div class="value">
              <textarea class="inp inp-area" style="width:400px;" placeholder="메모를 입력하세요"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Display Info -->
    <div class="article">
      <div class="article-header">
        <span class="article-title">디스플레이 정보</span>
      </div>
      <div class="article-inner">
        <div class="form-grid">
          <div class="label">제조사</div>
          <div class="value"><input type="text" class="inp" style="width:200px;" placeholder="예: Samsung"></div>

          <div class="label">모델명</div>
          <div class="value"><input type="text" class="inp" style="width:200px;" placeholder="모델명"></div>

          <div class="label">해상도 <span class="req">*</span></div>
          <div class="value" style="gap:6px;">
            <input type="number" class="inp" style="width:90px;" placeholder="1920">
            <span class="text-muted">×</span>
            <input type="number" class="inp" style="width:90px;" placeholder="1080">
            <span class="text-muted text-sm">px</span>
          </div>

          <div class="label">화면 방향 <span class="req">*</span></div>
          <div class="value" style="gap:16px;">
            <label style="display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;">
              <input type="radio" name="orient" value="landscape" checked> 가로
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;">
              <input type="radio" name="orient" value="portrait"> 세로
            </label>
          </div>

          <div class="label">화면 크기</div>
          <div class="value" style="gap:6px;">
            <input type="number" class="inp" style="width:80px;" placeholder="55">
            <span class="text-muted text-sm">인치</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Settop Info -->
    <div class="article">
      <div class="article-header">
        <span class="article-title">셋톱박스 정보</span>
      </div>
      <div class="article-inner">
        <div class="form-grid">
          <div class="label">시리얼 번호</div>
          <div class="value" style="gap:8px;">
            <input type="text" class="inp" style="width:220px;" placeholder="시리얼 번호 입력">
            <button class="btn btn-plain btn-sm">연결 확인</button>
            <span class="conn-badge">연결됨</span>
          </div>

          <div class="label">OS</div>
          <div class="value">
            <select class="sel" style="width:160px;"><option>Android</option></select>
          </div>

          <div class="label">OS 버전</div>
          <div class="value"><input type="text" class="inp" style="width:160px;" placeholder="예: 11.0"></div>

          <div class="label">콘텐츠 재생 포맷</div>
          <div class="value" style="gap:12px; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer;"><input type="checkbox" checked> MP4</label>
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer;"><input type="checkbox" checked> AVI</label>
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer;"><input type="checkbox"> MKV</label>
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer;"><input type="checkbox" checked> JPG</label>
            <label style="display:flex; align-items:center; gap:5px; font-size:14px; cursor:pointer;"><input type="checkbox" checked> PNG</label>
          </div>

          <div class="label">IP 주소</div>
          <div class="value"><input type="text" class="inp" style="width:180px;" placeholder="192.168.0.100"></div>

          <div class="label">MAC 주소</div>
          <div class="value"><input type="text" class="inp" style="width:200px;" placeholder="00:1A:2B:3C:4D:5E"></div>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="article" style="margin-bottom:0;">
      <div style="display:flex; justify-content:flex-end; gap:10px; padding: 0 0 48px;">
        <button class="btn btn-gray" onclick="history.back()">취소</button>
        <button class="btn btn-primary" style="min-width:80px;">등록</button>
      </div>
    </div>

  </main>

  <script>
    function toggleProfile(e) { e.stopPropagation(); document.getElementById('profileDropdown').classList.toggle('open'); }
    document.addEventListener('click', function() { document.getElementById('profileDropdown').classList.remove('open'); });
    function updatePadding() {
      var h = document.getElementById('topbar').offsetHeight;
      document.getElementById('mainContent').style.paddingTop = (h + 24) + 'px';
    }
    updatePadding();
    window.addEventListener('resize', updatePadding);
  </script>
</body>
</html>

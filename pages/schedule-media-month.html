<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미디어 편성표 – 월간 — D'ooh CMS</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    /* ── 2-column layout ── */
    .sched-media-layout {
      display: grid;
      grid-template-columns: 60fr 40fr;
      gap: 20px;
      align-items: flex-start;
    }

    /* ── Toolbar ── */
    .sched-toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .select-dropdown {
      height: 34px; padding: 0 12px;
      border: 1px solid #CED2D6; border-radius: 6px;
      background: #fff; font-size: 13px; color: #24292E;
      font-family: inherit; cursor: pointer; outline: none;
    }
    .select-dropdown:focus { border-color: #58C65D; }

    .date-nav {
      display: flex; align-items: center; gap: 8px; margin-left: auto;
    }
    .date-nav-btn {
      width: 30px; height: 30px;
      border: 1px solid #CED2D6; border-radius: 6px;
      background: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #596066; transition: border-color 0.15s;
    }
    .date-nav-btn:hover { border-color: #58C65D; color: #58C65D; }
    .date-label {
      font-size: 14px; font-weight: 700; color: #24292E;
      min-width: 100px; text-align: center;
    }
    .view-btn {
      height: 34px; padding: 0 14px;
      border: 1px solid #CED2D6; border-radius: 6px;
      background: #fff; font-size: 13px; font-weight: 500; color: #596066;
      cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center;
      transition: border-color 0.15s, color 0.15s;
    }
    .view-btn:hover { border-color: #58C65D; color: #58C65D; }

    /* ── Calendar ── */
    .cal-panel {
      background: #fff;
      border: 1px solid #E5E7EA;
      border-radius: 10px;
      overflow: hidden;
    }

    .cal-header {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid #E5E7EA;
      background: #F6F7F9;
    }
    .cal-dow {
      padding: 8px 0; text-align: center;
      font-size: 12px; font-weight: 600; color: #596066;
    }
    .cal-dow:first-child { color: #E24B4B; }
    .cal-dow:last-child  { color: #2D84ED; }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-left: 1px solid #E5E7EA;
    }
    .cal-cell-wrap { position: relative; }
    .cal-cell {
      min-height: 110px;
      border-right: 1px solid #E5E7EA;
      border-bottom: 1px solid #E5E7EA;
      padding: 6px 8px 6px;
      position: relative; vertical-align: top;
      transition: background 0.1s;
    }
    .cal-cell.clickable { cursor: pointer; }
    .cal-cell.clickable:hover { background: #F6F7F9; }
    .cal-cell.other-month { background: #FAFAFA; }
    .cal-cell.other-month .cal-date { color: #CED2D6; }
    .cal-cell.today .cal-date {
      background: #58C65D; color: #fff !important;
      width: 22px; height: 22px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .cal-date {
      font-size: 12px; font-weight: 600; color: #24292E;
      display: inline-block; margin-bottom: 5px;
      line-height: 22px;
    }
    .cal-cell-wrap:nth-child(7n+1) .cal-date { color: #E24B4B; }
    .cal-cell-wrap:nth-child(7n)   .cal-date { color: #2D84ED; }
    .cal-cell.today .cal-date { color: #fff !important; }

    /* Status dot row */
    .cal-status-row {
      display: flex; align-items: center; gap: 5px; margin-bottom: 6px;
    }
    .cal-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .cal-status-label { font-size: 10px; color: #596066; }

    /* Dual progress bars */
    .cal-bars { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
    .cal-bar-row { display: flex; align-items: center; gap: 4px; }
    .cal-bar-label { font-size: 9px; color: #9EA5AD; width: 38px; flex-shrink: 0; }
    .cal-bar-track {
      flex: 1; height: 5px; background: #F0F1F3;
      border-radius: 3px; overflow: hidden;
    }
    .cal-bar-fill { height: 100%; border-radius: 3px; }
    .cal-bar-val { font-size: 9px; color: #9EA5AD; width: 24px; text-align: right; flex-shrink: 0; }

    /* Tooltip */
    .cal-tooltip {
      display: none;
      position: absolute;
      top: 0; left: calc(100% + 6px);
      z-index: 200;
      background: #fff;
      border: 1px solid #E5E7EA;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.14);
      padding: 12px 14px;
      min-width: 180px;
      max-width: 240px;
      pointer-events: none;
    }
    .cal-cell-wrap.tip-left .cal-tooltip {
      left: auto; right: calc(100% + 6px);
    }
    .cal-cell-wrap:hover .cal-tooltip { display: block; }
    .cal-tooltip-date {
      font-size: 12px; font-weight: 700; color: #24292E;
      margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid #E5E7EA;
    }
    .cal-tooltip-row {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #596066; margin-bottom: 4px; gap: 12px;
    }
    .cal-tooltip-row span:first-child { color: #9EA5AD; white-space: nowrap; }
    .cal-tooltip-row span:last-child { font-weight: 600; color: #24292E; white-space: nowrap; }

    /* Legend */
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap;
      padding: 10px 14px; border-top: 1px solid #E5E7EA;
      background: #FAFBFC;
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #596066; }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Right panel ── */
    .schedule-panel {
      background: #fff;
      border: 1px solid #E5E7EA;
      border-radius: 10px;
      overflow: hidden;
    }
    .schedule-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid #E5E7EA;
      display: flex; align-items: center; justify-content: space-between;
    }
    .schedule-panel-title {
      font-size: 14px; font-weight: 700; color: #24292E;
    }
    .schedule-panel-count {
      font-size: 12px; color: #9EA5AD; font-weight: 500;
    }
    .schedule-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

    .sched-card {
      border: 1px solid #E5E7EA; border-radius: 8px;
      padding: 12px 14px; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .sched-card:hover {
      border-color: #58C65D;
      box-shadow: 0 2px 8px rgba(88,198,93,.12);
    }
    .sched-card-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap;
    }
    .product-badge {
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      flex-shrink: 0; white-space: nowrap;
    }
    .prod-a { background: #EEF2FF; color: #3730A3; }
    .prod-b { background: #FFF7ED; color: #9A3412; }
    .sched-card-name {
      font-size: 13px; font-weight: 600; color: #24292E;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-badge {
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px;
      flex-shrink: 0; display: flex; align-items: center; gap: 4px;
      white-space: nowrap;
    }
    .status-badge.running  { background: #ECFDF5; color: #065F46; }
    .status-badge.upcoming { background: #EFF6FF; color: #1D4ED8; }
    .status-badge .s-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .status-badge.running  .s-dot { background: #10B981; }
    .status-badge.upcoming .s-dot { background: #3B82F6; }

    .sched-card-meta {
      font-size: 11px; color: #9EA5AD;
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 4px;
    }
    .sched-card-meta .sep { color: #CED2D6; }
    .sched-card-advertiser { font-size: 11px; color: #596066; font-weight: 500; }

    /* ── Breadcrumb ── */
    .bcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: #9EA5AD; margin-bottom: 16px;
    }
    .bcrumb a { color: #596066; text-decoration: none; }
    .bcrumb a:hover { color: #58C65D; }
    .bcrumb-sep { color: #CED2D6; }
    .bcrumb-current { color: #24292E; font-weight: 600; }
  </style>
</head>

<script>
  /* ── Calendar data – June 2026 (max sec=600, max slot=20) ── */
  const calData = {
    '2026-06-01': { sec: 540, slot: 18 },
    '2026-06-02': { sec: 480, slot: 16 },
    '2026-06-03': { sec: 390, slot: 13 },
    '2026-06-04': { sec: 600, slot: 20 },
    '2026-06-05': { sec: 300, slot: 10 },
    '2026-06-06': { sec: 240, slot: 9  },
    '2026-06-07': { sec: 120, slot: 4  },
    '2026-06-08': { sec: 60,  slot: 2  },
    '2026-06-09': { sec: 450, slot: 15 },
    '2026-06-10': { sec: 500, slot: 17 },
    '2026-06-11': { sec: 90,  slot: 3  },
    '2026-06-12': { sec: 0,   slot: 0  },
    '2026-06-13': { sec: 30,  slot: 1  },
    '2026-06-14': { sec: 360, slot: 12 },
    '2026-06-15': { sec: 420, slot: 14 },
    '2026-06-16': { sec: 570, slot: 19 },
    '2026-06-17': { sec: 150, slot: 5  },
    '2026-06-18': { sec: 200, slot: 7  },
    '2026-06-19': { sec: 0,   slot: 0  },
    '2026-06-20': { sec: 50,  slot: 2  },
    '2026-06-21': { sec: 310, slot: 11 },
    '2026-06-22': { sec: 430, slot: 14 },
    '2026-06-23': { sec: 510, slot: 18 },
    '2026-06-24': { sec: 80,  slot: 3  },
    '2026-06-25': { sec: 260, slot: 9  },
    '2026-06-26': { sec: 0,   slot: 0  },
    '2026-06-27': { sec: 40,  slot: 1  },
    '2026-06-28': { sec: 580, slot: 20 },
    '2026-06-29': { sec: 350, slot: 12 },
    '2026-06-30': { sec: 190, slot: 6  },
  };

  const MAX_SEC  = 600;
  const MAX_SLOT = 20;

  function getStatusColor(sec, slot) {
    const minPct = Math.min(sec / MAX_SEC, slot / MAX_SLOT) * 100;
    if (minPct === 0)  return '#EF4444';
    if (minPct < 20)   return '#F97316';
    if (minPct < 50)   return '#F59E0B';
    return '#10B981';
  }

  function getStatusLabel(sec, slot) {
    const minPct = Math.min(sec / MAX_SEC, slot / MAX_SLOT) * 100;
    if (minPct === 0)  return '등록불가';
    if (minPct < 20)   return '매우위험';
    if (minPct < 50)   return '위험';
    return '여유';
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtKey(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }

  let currentYear  = 2026;
  let currentMonth = 6;

  function renderCalendar(year, month) {
    document.getElementById('monthLabel').textContent = year + '년 ' + month + '월';
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const firstDay    = new Date(year, month - 1, 1).getDay();   // 0=Sun
    const daysInMonth = new Date(year, month, 0).getDate();
    const daysInPrev  = new Date(year, month - 1, 0).getDate();

    const today = new Date();
    const todayStr = fmtKey(today.getFullYear(), today.getMonth() + 1, today.getDate());

    const cells = [];
    for (let i = firstDay - 1; i >= 0; i--) {
      cells.push({ day: daysInPrev - i, thisMonth: false, m: month - 1 || 12, y: month === 1 ? year - 1 : year });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, thisMonth: true, m: month, y: year });
    }
    const rem = cells.length % 7 === 0 ? 0 : 7 - (cells.length % 7);
    for (let i = 1; i <= rem; i++) {
      cells.push({ day: i, thisMonth: false, m: month === 12 ? 1 : month + 1, y: month === 12 ? year + 1 : year });
    }

    cells.forEach(function(c, idx) {
      const colIdx  = idx % 7;
      const dateStr = c.thisMonth ? fmtKey(c.y, c.m, c.day) : null;
      const data    = dateStr ? (calData[dateStr] || null) : null;

      const wrap = document.createElement('div');
      wrap.className = 'cal-cell-wrap';
      if (colIdx >= 5) wrap.classList.add('tip-left');

      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (!c.thisMonth) cell.classList.add('other-month');
      if (dateStr === todayStr) cell.classList.add('today');
      if (c.thisMonth) {
        cell.classList.add('clickable');
        cell.onclick = function() { window.location.href = 'schedule-media-day.html'; };
      }

      const dateEl = document.createElement('span');
      dateEl.className = 'cal-date';
      dateEl.textContent = c.day;
      cell.appendChild(dateEl);

      if (data && c.thisMonth) {
        const color   = getStatusColor(data.sec, data.slot);
        const label   = getStatusLabel(data.sec, data.slot);
        const secPct  = Math.round((data.sec  / MAX_SEC)  * 100);
        const slotPct = Math.round((data.slot / MAX_SLOT) * 100);

        // Status row
        const sr = document.createElement('div');
        sr.className = 'cal-status-row';
        sr.innerHTML =
          '<span class="cal-status-dot" style="background:' + color + '"></span>' +
          '<span class="cal-status-label">' + label + '</span>';
        cell.appendChild(sr);

        // Dual bars
        const bars = document.createElement('div');
        bars.className = 'cal-bars';
        bars.innerHTML =
          '<div class="cal-bar-row">' +
            '<span class="cal-bar-label">사이클</span>' +
            '<div class="cal-bar-track"><div class="cal-bar-fill" style="width:' + secPct + '%;background:' + color + ';opacity:0.7"></div></div>' +
            '<span class="cal-bar-val">' + data.sec + 's</span>' +
          '</div>' +
          '<div class="cal-bar-row">' +
            '<span class="cal-bar-label">슬롯</span>' +
            '<div class="cal-bar-track"><div class="cal-bar-fill" style="width:' + slotPct + '%;background:' + color + ';opacity:0.7"></div></div>' +
            '<span class="cal-bar-val">' + data.slot + '</span>' +
          '</div>';
        cell.appendChild(bars);

        // Tooltip
        const tip = document.createElement('div');
        tip.className = 'cal-tooltip';
        tip.innerHTML =
          '<div class="cal-tooltip-date">' + year + '년 ' + month + '월 ' + c.day + '일</div>' +
          '<div class="cal-tooltip-row"><span>잔여 사이클 시간</span><span>' + data.sec + '초 / ' + MAX_SEC + '초</span></div>' +
          '<div class="cal-tooltip-row"><span>잔여 슬롯 수</span><span>' + data.slot + ' / ' + MAX_SLOT + '</span></div>' +
          '<div class="cal-tooltip-row"><span>상태</span><span style="color:' + color + ';font-weight:700">' + label + '</span></div>';

        wrap.appendChild(cell);
        wrap.appendChild(tip);
      } else {
        wrap.appendChild(cell);
      }

      grid.appendChild(wrap);
    });
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
    if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
    renderCalendar(currentYear, currentMonth);
  }

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스케줄 블록 상세 — D'ooh CMS</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    body {
      margin: 0;
      background: rgba(24, 29, 33, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 29, 33, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    /* modal-box.sm */
    .modal-box {
      background: #fff;
      border-radius: 12px;
      width: 400px;
      max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #E5E7EA;
    }
    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #24292E;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      width: 28px; height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      color: #9EA5AD;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .modal-close:hover { background: #F6F7F9; color: #24292E; }
    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid #E5E7EA;
      background: #FAFAFA;
    }

    /* 상태 뱃지 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
    }
    .status-badge.confirmed { background: #E8F8E9; color: #2E9E34; }
    .status-badge.draft { background: #F6F7F9; color: #596066; border: 1px dashed #CED2D6; }

    /* 상세 행 */
    .detail-row {
      display: flex;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid #F6F7F9;
      font-size: 14px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-key {
      min-width: 90px;
      color: #9EA5AD;
      font-size: 13px;
      padding-top: 1px;
    }
    .detail-val {
      color: #24292E;
      font-weight: 500;
      flex: 1;
    }
  </style>
</head>
<body>

<div class="modal-backdrop" onclick="handleBackdrop(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <span class="modal-title">
        스케줄 블록 상세
      </span>
      <button class="modal-close" onclick="history.back()" title="닫기">✕</button>
    </div>

    <div class="modal-body">
      <div class="detail-row">
        <span class="detail-key">스케줄명</span>
        <span class="detail-val">강남역 CF 광고</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">상태</span>
        <span class="detail-val"><span class="status-badge confirmed">● 확정</span></span>
      </div>
      <div class="detail-row">
        <span class="detail-key">유형</span>
        <span class="detail-val">일반 스케줄</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">프로덕트</span>
        <span class="detail-val">강남 프리미엄 패키지</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">광고주</span>
        <span class="detail-val">(주)에이스광고</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">기간</span>
        <span class="detail-val">2025.10.01 ~ 2025.10.31</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">재생 시간</span>
        <span class="detail-val">30초</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">보장 횟수</span>
        <span class="detail-val">100회</span>
      </div>
      <div class="detail-row">
        <span class="detail-key">콘텐츠</span>
        <span class="detail-val" style="color:#2D84ED;">광고영상_v2.mp4</span>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="history.back()">닫기</button>
      <button class="btn btn-primary" onclick="location.href='schedule-register-form'">
        스케줄 상세 보기 →
      </button>
    </div>
  </div>
</div>

<script>
  function handleBackdrop(e) {
    if (e.target === e.currentTarget) history.back();
  }
</script>
</body>
</html>

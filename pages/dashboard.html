<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 — CMS</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    /* ── Two-column layout ── */
    .dash-columns {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .dash-col-map    { flex: 1.5; min-width: 0; }
    .dash-col-device { flex: 1;   min-width: 0; }

    /* ── Map placeholder ── */
    .map-body {
      position: relative;
      height: 380px;
      background: #EFF0F2;
      border: 1px solid #CED2D6;
      overflow: hidden;
    }
    .map-pin-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 24px; height: 30px;
    }
    .map-dot {
      position: absolute;
      width: 11px; height: 11px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }

    /* ── Sub-stat 2×2 grid ── */
    .device-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .device-item {
      background: #fff;
      border: 1px solid #E5E7EA;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .device-item-label {
      font-size: 12px;
      color: #9EA5AD;
    }
    .device-item-value {
      font-size: 24px;
      font-weight: 700;
      color: #24292E;
      line-height: 1;
    }

    /* ── Device card divider ── */
    .device-divider {
      height: 1px;
      background: #E5E7EA;
      margin: 4px 0 14px;
    }

    /* ── Error section ── */
    .error-title {
      font-size: 13px;
      font-weight: 600;
      color: #E97474;
      margin-bottom: 10px;
    }
    .error-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .error-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .error-item-label { color: #596066; }
    .error-item-value { font-weight: 600; color: #E97474; }

    /* ── Chart card ── */
    .chart-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .year-nav {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .year-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px; height: 26px;
      border: 1px solid #CED2D6;
      background: #fff;
      color: #596066;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .year-nav-btn:hover { background: #F6F7F9; color: #24292E; }
    .year-nav-btn.left  { border-radius: 4px 0 0 4px; border-right: none; }
    .year-nav-btn.right { border-radius: 0 4px 4px 0; border-left: none; }
    .year-label {
      height: 26px;
      line-height: 26px;
      padding: 0 14px;
      border: 1px solid #CED2D6;
      font-size: 14px;
      color: #24292E;
      background: #fff;
    }

    /* ── Seg control ── */
    .seg {
      display: flex;
      border: 1px solid #CED2D6;
      border-radius: 4px;
      overflow: hidden;
    }
    .seg button {
      height: 26px;
      padding: 0 14px;
      font-size: 13px;
      color: #596066;
      background: #fff;
      border: none;
      border-right: 1px solid #CED2D6;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .seg button:last-child { border-right: none; }
    .seg button:hover { background: #F6F7F9; }
    .seg button.active {
      background: #58C65D;
      color: #fff;
      font-weight: 600;
    }

    /* ── Bar chart placeholder ── */
    .chart-area {
      position: relative;
      height: 220px;
      background: #FAFAFA;
      border: 1px dashed #E5E7EA;
      border-radius: 4px;
      overflow: hidden;
    }
    .chart-bar {
      position: absolute;
      bottom: 28px;
      width: 4%;
      border-radius: 3px 3px 0 0;
      background: #58C65D;
      opacity: 0.7;
    }
    .chart-x-label {
      position: absolute;
      bottom: 8px;
      transform: translateX(-50%);
      font-size: 10px;
      color: #9EA5AD;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- ZONE 1: GNB Sidebar -->
  <aside class="gnb">
    <!-- Logo -->
    <div class="gnb-logo">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="44" height="44" rx="8" fill="rgba(255,255,255,0.1)"/>
        <rect x="6" y="6" width="32" height="32" rx="6" fill="none" stroke="#58C65D" stroke-width="1.5"/>
        <text x="22" y="27" text-anchor="middle" dominant-baseline="auto"
              font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
              font-size="13" font-weight="700" fill="#58C65D">DL</text>
      </svg>
    </div>

    <!-- Nav items -->
    <nav class="gnb-nav">
      <!-- 대시보드 (active) -->
      <a href="dashboard.html" class="active" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="7" height="7" rx="1"/>
          <rect x="11" y="2" width="7" height="7" rx="1"/>
          <rect x="2" y="11" width="7" height="7" rx="1"/>
          <rect x="11" y="11" width="7" height="7" rx="1"/>
        </svg>
        대시보드
      </a>

      <!-- 미디어 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="3" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 17h6M10 15v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        미디어
      </a>

      <!-- 미디어그룹 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="5" width="16" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5 5V4a1 1 0 011-1h8a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        미디어그룹
      </a>

      <!-- 콘텐츠 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2H5a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7l-5-5zm-1 1.5V7h3.5M7 11h6M7 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
        콘텐츠
      </a>

      <!-- 스케줄 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M2 8h16M7 2v3M13 2v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <rect x="5" y="11" width="2" height="2" rx="0.5"/>
          <rect x="9" y="11" width="2" height="2" rx="0.5"/>
          <rect x="13" y="11" width="2" height="2" rx="0.5"/>
        </svg>
        스케줄
      </a>

      <!-- 모니터링 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 14l4-5 3 3 4-6 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        모니터링
      </a>

      <!-- Divider -->
      <div class="gnb-divider"></div>

      <!-- 태그검색 -->
      <a href="#" onclick="return false;">
        <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.5 2.5L17 9a2 2 0 010 2.83l-5 5a2 2 0 01-2.83 0L3 10.5V4a1.5 1.5 0 011.5-1.5h6z" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="7" cy="7" r="1" fill="currentColor"/>
        </svg>
        태그검색
      </a>
    </nav>
  </aside>

  <!-- ZONE 2: Topbar -->
  <header class="topbar">
    <!-- Search -->
    <div class="topbar-search">
      <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="#9EA5AD" stroke-width="1.4"/>
        <path d="M10.5 10.5L14 14" stroke="#9EA5AD" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input type="text" placeholder="검색">
    </div>

    <!-- Right: icons + profile -->
    <div class="topbar-user">
      <!-- Bell icon -->
      <div class="topbar-icon-btn">
        <div class="dot-badge"></div>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 2a5.5 5.5 0 00-5.5 5.5V11l-1.2 2h13.4L14.5 11V7.5A5.5 5.5 0 009 2z" stroke="#9EA5AD" stroke-width="1.3" fill="none"/>
          <path d="M7 14a2 2 0 004 0" stroke="#9EA5AD" stroke-width="1.3" fill="none"/>
        </svg>
      </div>

      <!-- Warning icon -->
      <div class="topbar-icon-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="7" stroke="#9EA5AD" stroke-width="1.3"/>
          <line x1="9" y1="5.5" x2="9" y2="10" stroke="#9EA5AD" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="9" cy="12" r="0.8" fill="#9EA5AD"/>
        </svg>
      </div>

      <!-- Profile dropdown -->
      <div class="topbar-profile" id="profileTrigger" onclick="toggleProfile(event)">
        <div class="topbar-avatar">관</div>
        <div class="topbar-profile-info">
          <div class="topbar-profile-name">관리자</div>
          <div class="topbar-profile-org">DOOH Service</div>
        </div>
        <span class="topbar-caret">▾</span>

        <div class="profile-dropdown" id="profileDropdown">
          <a href="#">내 정보</a>
          <a href="#">비밀번호 변경</a>
          <a href="login.html" class="logout">로그아웃</a>
        </div>
      </div>
    </div>
  </header>

  <!-- ZONE 3: Breadcrumb -->
  <div class="bcrumb">
    <a href="dashboard.html" class="cur">대시보드</a>
    <span class="sep">&rsaquo;</span>
    <span class="cur">운영 현황</span>
  </div>

  <!-- ZONE 4: Content -->
  <main class="content">
    <div class="content-inner">

      <!-- 1. Stat cards row -->
      <div class="stat-row">
        <!-- 전체 미디어 (no dot) -->
        <div class="stat-card">
          <div class="stat-card-label">전체 미디어</div>
          <div class="stat-card-value">128</div>
        </div>

        <!-- 온라인 (active = green) -->
        <div class="stat-card active">
          <div class="stat-card-label">온라인</div>
          <div class="stat-card-value">115</div>
        </div>

        <!-- 오프라인 -->
        <div class="stat-card">
          <div class="stat-card-label">오프라인</div>
          <div class="stat-card-value">8</div>
        </div>

        <!-- 점검 중 -->
        <div class="stat-card">
          <div class="stat-card-label">점검 중</div>
          <div class="stat-card-value">5</div>
        </div>
      </div>

      <!-- 2. Two-column layout -->
      <div class="dash-columns">

        <!-- Left: Map card -->
        <div class="card dash-col-map">
          <div class="card-head">
            <span class="card-title">미디어 사이트 위치</span>
            <button class="btn btn-ghost btn-sm">목록 보기</button>
          </div>
          <div class="map-body">
            <!-- Center pin SVG -->
            <svg class="map-pin-center" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 0C7.03 0 3 4.03 3 9c0 6.75 9 21 9 21s9-14.25 9-21c0-4.97-4.03-9-9-9zm0 12a3 3 0 110-6 3 3 0 010 6z" fill="#58C65D"/>
            </svg>
            <!-- Dummy dots -->
            <div class="map-dot" style="background:#58C65D; top:28%; left:22%;"></div>
            <div class="map-dot" style="background:#58C65D; top:38%; left:55%;"></div>
            <div class="map-dot" style="background:#58C65D; top:60%; left:38%;"></div>
            <div class="map-dot" style="background:#E97474; top:52%; left:68%;"></div>
            <div class="map-dot" style="background:#58C65D; top:72%; left:25%;"></div>
            <div class="map-dot" style="background:#E97474; top:20%; left:74%;"></div>
            <div class="map-dot" style="background:#58C65D; top:80%; left:60%;"></div>
          </div>
        </div>

        <!-- Right: Device status card -->
        <div class="card dash-col-device">
          <div class="card-head">
            <span class="card-title">기기 상태 현황</span>
          </div>
          <div class="card-body">
            <!-- 2×2 sub-stat grid -->
            <div class="device-grid">
              <div class="device-item">
                <div class="device-item-label">디스플레이</div>
                <div class="device-item-value">115</div>
              </div>
              <div class="device-item">
                <div class="device-item-label">PC</div>
                <div class="device-item-value">112</div>
              </div>
              <div class="device-item">
                <div class="device-item-label">네트워크</div>
                <div class="device-item-value">118</div>
              </div>
              <div class="device-item">
                <div class="device-item-label">전원</div>
                <div class="device-item-value">128</div>
              </div>
            </div>

            <!-- Divider -->
            <div class="device-divider"></div>

            <!-- Error section -->
            <div class="error-title">&#9888; 오류 현황</div>
            <div class="error-list">
              <div class="error-item">
                <span class="error-item-label">디스플레이</span>
                <span class="error-item-value">3</span>
              </div>
              <div class="error-item">
                <span class="error-item-label">PC</span>
                <span class="error-item-value">5</span>
              </div>
              <div class="error-item">
                <span class="error-item-label">네트워크</span>
                <span class="error-item-value">2</span>
              </div>
            </div>
          </div>
        </div>

      </div><!-- /.dash-columns -->

      <!-- 3. Chart card -->
      <div class="card">
        <div class="card-head">
          <span class="card-title">콘텐츠 집행 현황</span>
          <div class="chart-controls">
            <!-- Year nav -->
            <div class="year-nav">
              <a href="#" class="year-nav-btn left" onclick="return false;">&#8249;</a>
              <span class="year-label" id="yearLabel">2024</span>
              <a href="#" class="year-nav-btn right" onclick="return false;">&#8250;</a>
            </div>
            <!-- Seg control -->
            <div class="seg">
              <button class="active" onclick="seg(this)">월별</button>
              <button onclick="seg(this)">주별</button>
              <button onclick="seg(this)">일별</button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="chart-area" id="chartArea">
            <!-- Dummy bars (12 months) — heights vary -->
            <div class="chart-bar" style="height:72px;  left:5.5%;"></div>
            <div class="chart-bar" style="height:108px; left:13.5%;"></div>
            <div class="chart-bar" style="height:88px;  left:21.5%;"></div>
            <div class="chart-bar" style="height:148px; left:29.5%;"></div>
            <div class="chart-bar" style="height:104px; left:37.5%;"></div>
            <div class="chart-bar" style="height:168px; left:45.5%;"></div>
            <div class="chart-bar" style="height:124px; left:53.5%;"></div>
            <div class="chart-bar" style="height:156px; left:61.5%;"></div>
            <div class="chart-bar" style="height:84px;  left:69.5%;"></div>
            <div class="chart-bar" style="height:136px; left:77.5%;"></div>
            <div class="chart-bar" style="height:96px;  left:85.5%;"></div>
            <div class="chart-bar" style="height:64px;  left:93.5%;"></div>
            <!-- X axis labels -->
            <span class="chart-x-label" style="left:5.5%;">1월</span>
            <span class="chart-x-label" style="left:13.5%;">2월</span>
            <span class="chart-x-label" style="left:21.5%;">3월</span>
            <span class="chart-x-label" style="left:29.5%;">4월</span>
            <span class="chart-x-label" style="left:37.5%;">5월</span>
            <span class="chart-x-label" style="left:45.5%;">6월</span>
            <span class="chart-x-label" style="left:53.5%;">7월</span>
            <span class="chart-x-label" style="left:61.5%;">8월</span>
            <span class="chart-x-label" style="left:69.5%;">9월</span>
            <span class="chart-x-label" style="left:77.5%;">10월</span>
            <span class="chart-x-label" style="left:85.5%;">11월</span>
            <span class="chart-x-label" style="left:93.5%;">12월</span>
          </div>
        </div>
      </div><!-- /.card (chart) -->

    </div><!-- /.content-inner -->
  </main>

  <script>
    /* Profile dropdown toggle */
    function toggleProfile(e) {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('open');
    }
    document.addEventListener('click', function () {
      document.getElementById('profileDropdown').classList.remove('open');
    });

    /* Seg control */
    function seg(btn) {
      btn.closest('.seg').querySelectorAll('button').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
    }

    /* Year nav */
    (function () {
      var year = 2024;
      var label = document.getElementById('yearLabel');
      var prev = document.querySelector('.year-nav-btn.left');
      var next = document.querySelector('.year-nav-btn.right');
      prev.addEventListener('click', function (e) {
        e.preventDefault();
        year -= 1;
        label.textContent = year;
      });
      next.addEventListener('click', function (e) {
        e.preventDefault();
        year += 1;
        label.textContent = year;
      });
    })();
  </script>
</body>
</html>

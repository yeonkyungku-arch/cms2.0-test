<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — DOOH CMS 2.0</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #24292E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Card ── */
    .login-card {
      width: 400px;
      background: #ffffff;
      border-radius: 12px;
      padding: 40px;
    }

    /* ── Logo ── */
    .logo-block {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-mark {
      font-size: 32px;
      font-weight: 700;
      color: #58C65D;
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .logo-sub {
      font-size: 13px;
      color: #9EA5AD;
      margin-top: 6px;
    }

    /* ── Form ── */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Field group ── */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 13px;
      color: #9EA5AD;
      font-weight: 400;
    }

    /* ── Input wrapper ── */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 36px 0 12px;
      border: 1px solid #CED2D6;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      color: #24292E;
      background: #ffffff;
      outline: none;
      transition: all 0.25s ease;
    }
    .input-wrap input::placeholder { color: #CED2D6; /* updated */
      color: #CED2D6;
    }
    .input-wrap input:focus {
      border-color: #58C65D;
    }

    /* clear button */
    .btn-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #9EA5AD;
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
      font-size: 16px;
      transition: all 0.25s ease;
    }
    .btn-clear:hover {
      color: #596066;
    }
    .input-wrap.active .btn-clear {
      display: flex;
    }

    /* password eye toggle — sits to the left of clear */
    .input-wrap.pw-wrap input {
      padding-right: 68px;
    }
    .btn-eye {
      position: absolute;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: #9EA5AD;
      transition: all 0.25s ease;
    }
    .btn-eye:hover {
      color: #596066;
    }
    /* when clear is hidden, eye gets closer to edge */
    .input-wrap:not(.active) .btn-eye {
      right: 10px;
    }
    .input-wrap:not(.active).pw-wrap input {
      padding-right: 44px;
    }

    /* ── Options row ── */
    .options-row {
      display: flex;
      align-items: center;
      margin-top: 4px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input[type="checkbox"] {
      display: none;
    }
    /* pill track */
    .toggle-track {
      position: relative;
      width: 36px;
      height: 20px;
      border-radius: 100px;
      background: #CED2D6;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    /* thumb */
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      transition: all 0.25s ease;
    }
    .toggle-label input:checked + .toggle-track {
      background: #58C65D;
    }
    .toggle-label input:checked + .toggle-track::after {
      transform: translateX(16px);
    }
    .toggle-text {
      font-size: 13px;
      color: #596066;
    }

    /* ── Login button ── */
    .btn-login {
      width: 100%;
      height: 48px;
      background: #58C65D;
      color: #ffffff;
      border: 1px solid #58C65D;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.25s ease;
    }
    .btn-login:hover {
      background: #ffffff;
      color: #58C65D;
      border-color: #58C65D;
    }

    /* ── Links row ── */
    .link-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    .link-row a {
      font-size: 12px;
      color: #9EA5AD;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .link-row a:hover {
      color: #58C65D;
    }
    .link-sep {
      font-size: 12px;
      color: #E5E7EA;
    }

    /* ── Copyright ── */
    .copyright {
      text-align: center;
      font-size: 11px;
      color: #596066;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-block">
      <div class="logo-mark">DL</div>
      <div class="logo-sub">DOOH CMS 2.0</div>
    </div>

    <!-- Form -->
    <form class="login-form" onsubmit="return false;">

      <!-- 아이디 -->
      <div class="field-group">
        <label class="field-label" for="input-id">아이디</label>
        <div class="input-wrap" id="wrap-id">
          <input
            type="text"
            id="input-id"
            placeholder="아이디를 입력하세요"
            autocomplete="off"
            oninput="toggleClear('wrap-id', this)"
          >
          <button type="button" class="btn-clear" id="clear-id"
            onclick="clearInput('input-id', 'wrap-id')" aria-label="입력 초기화">
            &#215;
          </button>
        </div>
      </div>

      <!-- 비밀번호 -->
      <div class="field-group">
        <label class="field-label" for="input-password">비밀번호</label>
        <div class="input-wrap pw-wrap" id="wrap-pw">
          <input
            type="password"
            id="input-password"
            placeholder="비밀번호를 입력하세요"
            oninput="toggleClear('wrap-pw', this)"
          >
          <!-- Eye toggle -->
          <button type="button" class="btn-eye" id="btn-eye"
            onclick="togglePassword()" aria-label="비밀번호 표시/숨김">
            <!-- closed-eye SVG (default: password hidden) -->
            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
                a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            <!-- open-eye SVG (shown when password is visible) -->
            <svg id="icon-eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"
              style="display:none;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <!-- Clear button -->
          <button type="button" class="btn-clear" id="clear-pw"
            onclick="clearInput('input-password', 'wrap-pw')" aria-label="입력 초기화">
            &#215;
          </button>
        </div>
      </div>

      <!-- 로그인 상태 유지 -->
      <div class="options-row">
        <label class="toggle-label">
          <input type="checkbox" id="stay-signin">
          <span class="toggle-track"></span>
          <span class="toggle-text">로그인 상태 유지</span>
        </label>
      </div>

      <!-- 로그인 버튼 -->
      <button type="submit" class="btn-login">로그인</button>

    </form>

    <!-- 링크 -->
    <div class="link-row">
      <a href="find-id.html">아이디 찾기</a>
      <span class="link-sep">|</span>
      <a href="find-pw.html">비밀번호 찾기</a>
      <span class="link-sep">|</span>
      <a href="signup.html">회원가입</a>
    </div>

    <!-- Copyright -->
    <p class="copyright">© 2025 DOOH Service. All rights reserved.</p>

  </div>

  <script>
    // Show / hide the × clear button based on whether the field has content
    function toggleClear(wrapId, input) {
      const wrap = document.getElementById(wrapId);
      if (input.value.length > 0) {
        wrap.classList.add('active');
      } else {
        wrap.classList.remove('active');
      }
    }

    // Clear the field and hide the × button
    function clearInput(inputId, wrapId) {
      const input = document.getElementById(inputId);
      input.value = '';
      document.getElementById(wrapId).classList.remove('active');
      input.focus();
    }

    // Toggle password visibility (eye icon)
    function togglePassword() {
      const input   = document.getElementById('input-password');
      const iconOff = document.getElementById('icon-eye-off');
      const iconOn  = document.getElementById('icon-eye-on');

      if (input.type === 'password') {
        input.type       = 'text';
        iconOff.style.display = 'none';
        iconOn.style.display  = 'block';
      } else {
        input.type       = 'password';
        iconOff.style.display = 'block';
        iconOn.style.display  = 'none';
      }
    }
  </script>
</body>
</html>

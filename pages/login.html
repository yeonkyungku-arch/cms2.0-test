<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — DOOH CMS 2.0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      font-size: 14px;
      background: #ECECEC;
      color: #000;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 400px;
      background: #fff;
      border: 1px solid #58C65D;
      border-radius: 5px;
      padding: 40px;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.07));
    }

    .logo-block {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-mark {
      font-size: 32px;
      font-weight: 700;
      color: #58C65D;
      line-height: 1;
    }
    .logo-sub {
      font-size: 13px;
      color: #909399;
      margin-top: 6px;
      font-weight: 300;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 13px;
      color: #909399;
      font-weight: 300;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 36px 0 12px;
      border: 1px solid #D3D4D6;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      color: #000;
      background: #fff;
      outline: none;
      transition: all 0.25s ease;
    }
    .input-wrap input::placeholder { color: #D9D9D9; }
    .input-wrap input:focus { border-color: #58C65D; }

    .btn-clear {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      display: none;
      align-items: center; justify-content: center;
      cursor: pointer; color: #909399;
      background: none; border: none; padding: 0;
      font-size: 16px; transition: all 0.25s ease;
    }
    .btn-clear:hover { color: #000; }
    .input-wrap.active .btn-clear { display: flex; }

    .input-wrap.pw-wrap input { padding-right: 68px; }
    .btn-eye {
      position: absolute; right: 34px; top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: none; border: none;
      padding: 0; color: #909399; transition: all 0.25s ease;
    }
    .btn-eye:hover { color: #000; }
    .input-wrap:not(.active) .btn-eye { right: 10px; }
    .input-wrap:not(.active).pw-wrap input { padding-right: 44px; }

    .options-row {
      display: flex; align-items: center; margin-top: 4px;
    }
    .toggle-label {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
    }
    .toggle-label input[type="checkbox"] { display: none; }
    .toggle-track {
      position: relative; width: 26px; height: 16px;
      border-radius: 13px; background: #D3D4D6;
      transition: all 0.25s ease-in; flex-shrink: 0;
    }
    .toggle-track::after {
      content: ''; position: absolute; top: 1.5px; left: 2px;
      width: 11px; height: 11px; border-radius: 50%;
      background: #fff; transition: all 0.25s ease-in;
    }
    .toggle-label input:checked + .toggle-track { background: #58C65D; }
    .toggle-label input:checked + .toggle-track::after { left: calc(100% - 13px); }
    .toggle-text { font-size: 13px; color: #909399; font-weight: 300; }

    .btn-login {
      width: 100%; height: 48px;
      background: #58C65D; color: #fff;
      border: 1px solid #58C65D; border-radius: 4px;
      font-size: 20px; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 8px;
      transition: all 0.25s ease;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    }
    .btn-login:hover { background: #89D58C; border-color: #89D58C; }
    .btn-login:focus { background: #fff; color: #58C65D; }

    .link-row {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-top: 20px;
    }
    .link-row a {
      font-size: 12px; color: #808080;
      text-decoration: none; transition: all 0.25s ease;
      font-weight: 300;
    }
    .link-row a:hover { color: #58C65D; }
    .link-sep { font-size: 12px; color: #E5E7EA; }

    .copyright {
      text-align: center; font-size: 11px;
      color: #808080; margin-top: 24px; font-weight: 300;
    }
  </style>
</head>
<body>

  <div class="login-card">

    <div class="logo-block">
      <div class="logo-mark">DL</div>
      <div class="logo-sub">DOOH CMS 2.0</div>
    </div>

    <form class="login-form" onsubmit="return false;">

      <div class="field-group">
        <label class="field-label" for="input-id">아이디</label>
        <div class="input-wrap" id="wrap-id">
          <input type="text" id="input-id" placeholder="아이디를 입력하세요"
            autocomplete="off" oninput="toggleClear('wrap-id', this)">
          <button type="button" class="btn-clear" onclick="clearInput('input-id','wrap-id')">&#215;</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="input-pw">비밀번호</label>
        <div class="input-wrap pw-wrap" id="wrap-pw">
          <input type="password" id="input-pw" placeholder="비밀번호를 입력하세요"
            oninput="toggleClear('wrap-pw', this)">
          <button type="button" class="btn-eye" id="btn-eye" onclick="togglePw()">
            <svg id="eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
            <svg id="eye-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" style="display:none;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
          <button type="button" class="btn-clear" onclick="clearInput('input-pw','wrap-pw')">&#215;</button>
        </div>
      </div>

      <div class="options-row">
        <label class="toggle-label">
          <input type="checkbox" id="stay">
          <span class="toggle-track"></span>
          <span class="toggle-text">로그인 상태 유지</span>
        </label>
      </div>

      <button type="submit" class="btn-login" onclick="location.href='dashboard.html'">로그인</button>

    </form>

    <div class="link-row">
      <a href="#">아이디 찾기</a>
      <span class="link-sep">|</span>
      <a href="#">비밀번호 찾기</a>
      <span class="link-sep">|</span>
      <a href="#">회원가입</a>
    </div>

    <p class="copyright">© 2025 DOOH Service. All rights reserved.</p>
  </div>

  <script>
    function toggleClear(wrapId, input) {
      document.getElementById(wrapId).classList.toggle('active', input.value.length > 0);
    }
    function clearInput(inputId, wrapId) {
      document.getElementById(inputId).value = '';
      document.getElementById(wrapId).classList.remove('active');
      document.getElementById(inputId).focus();
    }
    function togglePw() {
      var inp = document.getElementById('input-pw');
      var off = document.getElementById('eye-off');
      var on  = document.getElementById('eye-on');
      if (inp.type === 'password') {
        inp.type = 'text'; off.style.display = 'none'; on.style.display = 'block';
      } else {
        inp.type = 'password'; off.style.display = 'block'; on.style.display = 'none';
      }
    }
  </script>
</body>
</html>

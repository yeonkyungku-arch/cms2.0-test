<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로덕트 편성표 – 월간 뷰 | D'ooh CMS 2.0</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', sans-serif; background: #F6F7F9; color: #24292E; font-size: 14px; }
    a { text-decoration: none; color: inherit; }

    /* GNB */
    .gnb { position: fixed; left: 0; top: 0; bottom: 0; width: 68px; background: #24292E; display: flex; flex-direction: column; align-items: center; padding: 16px 0; z-index: 100; }
    .gnb-logo { margin-bottom: 24px; }
    .gnb-nav { list-style: none; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
    .gnb-nav li { width: 100%; }
    .gnb-nav li a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 6px; color: #9EA5AD; font-size: 10px; font-weight: 500; border-radius: 8px; margin: 0 6px; width: calc(100% - 12px); transition: background 0.15s, color 0.15s; }
    .gnb-nav li a:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .gnb-nav li a.active { background: rgba(88,198,93,0.18); color: #58C65D; }
    .gnb-divider { width: 40px; height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; }

    /* Topbar */
    .topbar { position: fixed; top: 0; left: 68px; right: 0; height: 56px; background: #fff; border-bottom: 1px solid #E5E7EA; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 99; }
    .topbar-search { display: flex; align-items: center; gap: 8px; background: #F6F7F9; border: 1px solid #E5E7EA; border-radius: 8px; padding: 7px 12px; width: 280px; }
    .topbar-search input { border: none; background: transparent; outline: none; font-size: 13px; color: #24292E; width: 100%; }
    .topbar-search input::placeholder { color: #9EA5AD; }
    .topbar-user { display: flex; align-items: center; gap: 16px; }
    .topbar-icon-btn { position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; }
    .topbar-icon-btn:hover { background: #F6F7F9; }
    .dot-badge { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: #EF4444; border: 1.5px solid #fff; }
    .topbar-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .topbar-profile:hover { background: #F6F7F9; }
    .topbar-avatar { width: 32px; height: 32px; border-radius: 50%; background: #58C65D; color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .topbar-profile-info { display: flex; flex-direction: column; gap: 1px; }
    .topbar-profile-name { font-size: 13px; font-weight: 600; color: #24292E; }
    .topbar-profile-org { font-size: 11px; color: #9EA5AD; }

    /* Content */
    .content { margin-left: 68px; padding-top: 56px; min-height: 100vh; }
    .content-inner { padding: 24px 28px; }

    /* Breadcrumb */
    .bcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9EA5AD; margin-bottom: 20px; }
    .bcrumb a { color: #596066; }
    .bcrumb a:hover { color: #58C65D; }
    .bcrumb-sep { color: #C9CDD2; }
    .bcrumb-current { color: #24292E; font-weight: 600; }

    /* Page grid */
    .page-grid { display: grid; grid-template-columns: 60% 1fr; gap: 20px; align-items: start; }

    /* Panel */
    .panel { background: #fff; border: 1px solid #E5E7EA; border-radius: 12px; overflow: hidden; }

    /* Calendar Toolbar */
    .cal-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #E5E7EA; gap: 12px; }
    .cal-toolbar-left { display: flex; align-items: center; gap: 16px; }
    .cal-product-name { font-size: 15px; font-weight: 700; color: #24292E; }
    .cal-month-nav { display: flex; align-items: center; gap: 8px; }
    .cal-month-nav button { width: 28px; height: 28px; border: 1px solid #E5E7EA; border-radius: 6px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #596066; transition: background 0.12s; }
    .cal-month-nav button:hover { background: #F6F7F9; }
    .cal-month-label { font-size: 14px; font-weight: 600; color: #24292E; min-width: 96px; text-align: center; }
    .btn-day-view { font-size: 12px; font-weight: 600; color: #596066; background: #F6F7F9; border: 1px solid #E5E7EA; border-radius: 6px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background 0.12s, color 0.12s; white-space: nowrap; }
    .btn-day-view:hover { background: #eaebec; color: #24292E; }

    /* Calendar Grid */
    .cal-header-row { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid #E5E7EA; }
    .cal-header-cell { padding: 8px 0; text-align: center; font-size: 11px; font-weight: 600; color: #9EA5AD; letter-spacing: 0.02em; }
    .cal-header-cell.sun { color: #EF4444; }
    .cal-header-cell.sat { color: #60A5FA; }
    .cal-body { display: grid; grid-template-columns: repeat(7, 1fr); }

    .cal-cell { min-height: 100px; border-right: 1px solid #E5E7EA; border-bottom: 1px solid #E5E7EA; padding: 0; transition: background 0.12s; display: flex; flex-direction: column; position: relative; }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell.other-month { background: #FAFAFA; opacity: .55; }
    .cal-cell.other-month .cal-date-link { pointer-events: none; }
    .cal-cell.weekend { background: #FAFBFC; }
    .cal-cell.today .cal-date-link .cal-date-num { background: #58C65D; color: #fff !important; border-radius: 50%; }

    /* 날짜 숫자 링크 영역 */
    .cal-date-link { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex-shrink: 0; text-decoration: none; border-radius: 6px; transition: background .12s; }
    .cal-date-link:hover .cal-date-num { text-decoration: underline; }
    .cal-date-link:hover { background: rgba(88,198,93,.12); }
    .cal-date-num { font-size: 12px; font-weight: 600; color: #24292E; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; line-height: 1; }
    .cal-date-num.sunday { color: #EF4444; }
    .cal-date-num.saturday { color: #60A5FA; }

    /* 셀 헤더 (날짜 + 상태바) */
    .cal-cell-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 6px 3px; gap: 4px; }
    .cal-status-bar { height: 4px; border-radius: 3px; flex: 1; margin-top: 0; }
    .status-green  { background: #10B981; }
    .status-amber  { background: #F59E0B; }
    .status-orange { background: #F97316; }
    .status-red    { background: #EF4444; }

    /* 셀 바디 - 클릭하면 예약 모달 */
    .cal-cell-body { flex: 1; padding: 2px 6px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .cal-cell-body:hover { background: rgba(88,198,93,.04); }
    .cal-cell.other-month .cal-cell-body { pointer-events: none; }

    .cal-schedule-chip { font-size: 10px; padding: 2px 5px; border-radius: 0 3px 3px 0; border-left: 2px solid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }
    .chip-green  { background: #D1FAE5; color: #065F46; border-color: #10B981; }
    .chip-amber  { background: #FEF3C7; color: #78350F; border-color: #F59E0B; }
    .chip-orange { background: #FFF7ED; color: #9A3412; border-color: #F97316; }
    .chip-red    { background: #FEF2F2; color: #991B1B; border-color: #EF4444; }
    .chip-blue   { background: #DBEAFE; color: #1E40AF; border-color: #60A5FA; }
    .cal-more-chip { font-size: 9px; color: #9EA5AD; padding: 1px 4px; cursor: pointer; }

    /* ── 예약 모달 ── */
    .booking-overlay { position: fixed; inset: 0; background: rgba(36,41,46,.5); display: flex; align-items: center; justify-content: center; z-index: 400; backdrop-filter: blur(2px); }
    .booking-overlay.hidden { display: none; }
    .booking-modal { background: #fff; border-radius: 14px; width: 480px; max-width: calc(100vw - 32px); box-shadow: 0 24px 64px rgba(0,0,0,.2); overflow: hidden; }
    .booking-modal-head { padding: 18px 22px 14px; border-bottom: 1px solid #E5E7EA; display: flex; align-items: flex-start; justify-content: space-between; }
    .booking-modal-head h3 { font-size: 15px; font-weight: 700; color: #24292E; margin-bottom: 2px; }
    .booking-modal-head p  { font-size: 12px; color: #9EA5AD; }
    .booking-modal-close { width: 28px; height: 28px; border: none; background: #F6F7F9; border-radius: 6px; cursor: pointer; font-size: 16px; color: #596066; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .booking-modal-close:hover { background: #E5E7EA; }
    .booking-modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
    .booking-field label { display: block; font-size: 11px; font-weight: 600; color: #596066; margin-bottom: 5px; }
    .booking-field select,
    .booking-field input[type=text],
    .booking-field input[type=number] { width: 100%; height: 36px; padding: 0 10px; border: 1px solid #E5E7EA; border-radius: 8px; font-size: 13px; color: #24292E; outline: none; background: #fff; }
    .booking-field select:focus,
    .booking-field input:focus { border-color: #58C65D; }
    .booking-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .booking-day-schedules { border: 1px solid #E5E7EA; border-radius: 8px; overflow: hidden; }
    .booking-day-schedules-head { padding: 7px 12px; background: #F6F7F9; font-size: 11px; font-weight: 600; color: #596066; border-bottom: 1px solid #E5E7EA; }
    .booking-day-sched-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid #F0F1F3; font-size: 12px; }
    .booking-day-sched-item:last-child { border-bottom: none; }
    .booking-modal-foot { padding: 14px 22px; border-top: 1px solid #E5E7EA; display: flex; justify-content: flex-end; gap: 8px; }
    .btn-bk-cancel { height: 36px; padding: 0 16px; border: 1px solid #E5E7EA; border-radius: 8px; background: #fff; font-size: 13px; color: #596066; cursor: pointer; }
    .btn-bk-submit { height: 36px; padding: 0 20px; border: none; border-radius: 8px; background: #58C65D; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer; }
    .btn-bk-submit:hover { background: #4ab54f; }

    /* Legend */
    .cal-legend { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-top: 1px solid #E5E7EA; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #596066; }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Right panel */
    .schedule-panel-header { padding: 14px 18px 12px; border-bottom: 1px solid #E5E7EA; display: flex; align-items: baseline; gap: 8px; }
    .schedule-panel-title { font-size: 14px; font-weight: 700; color: #24292E; }
    .schedule-panel-hint { font-size: 11px; color: #9EA5AD; }
    .schedule-list { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }

    .schedule-card { border: 1px solid #E5E7EA; border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; gap: 5px; background: #fff; }
    .schedule-card:hover { border-color: #58C65D; box-shadow: 0 2px 8px rgba(88,198,93,0.12); }
    .schedule-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .schedule-card-name { font-size: 13px; font-weight: 600; color: #24292E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
    .badge-green { background: #D1FAE5; color: #065F46; }
    .badge-blue { background: #DBEAFE; color: #1E40AF; }
    .badge-amber { background: #FEF3C7; color: #92400E; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-dot-green { background: #10B981; }
    .badge-dot-blue { background: #3B82F6; }
    .badge-dot-amber { background: #F59E0B; }
    .schedule-card-meta { font-size: 11px; color: #9EA5AD; display: flex; align-items: center; gap: 4px; }
    .schedule-card-meta .sep { color: #D1D5DB; }
    .tag-condition { display: inline-flex; align-items: center; gap: 3px; background: #EEF2FF; color: #4338CA; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; }
    .schedule-card-advertiser { font-size: 12px; color: #596066; font-weight: 500; }

    /* ── 프로덕트 선택 오버레이 ── */
    .product-select-overlay {
      position: fixed; inset: 0; background: rgba(36,41,46,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; backdrop-filter: blur(2px);
    }
    .product-select-overlay.hidden { display: none; }
    .product-select-modal {
      background: #fff; border-radius: 14px;
      width: 520px; max-width: calc(100vw - 48px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
      overflow: hidden;
    }
    .product-select-head {
      padding: 20px 24px 16px;
      border-bottom: 1px solid #E5E7EA;
    }
    .product-select-head h2 {
      font-size: 16px; font-weight: 700; color: #24292E; margin-bottom: 4px;
    }
    .product-select-head p {
      font-size: 13px; color: #9EA5AD;
    }
    .product-select-search {
      padding: 12px 24px;
      border-bottom: 1px solid #F0F1F3;
    }
    .product-select-search input {
      width: 100%; height: 36px; padding: 0 12px;
      border: 1px solid #E5E7EA; border-radius: 8px;
      font-size: 13px; color: #24292E; outline: none;
      background: #F6F7F9;
    }
    .product-select-search input:focus { border-color: #58C65D; background: #fff; }
    .product-select-list {
      max-height: 320px; overflow-y: auto;
      padding: 8px 0;
    }
    .product-select-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 24px; cursor: pointer;
      transition: background 0.1s;
    }
    .product-select-item:hover { background: #F6F7F9; }
    .product-select-item.selected { background: rgba(88,198,93,0.08); }
    .product-select-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .product-select-info { flex: 1; min-width: 0; }
    .product-select-name {
      font-size: 14px; font-weight: 600; color: #24292E;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .product-select-meta {
      font-size: 11px; color: #9EA5AD; margin-top: 2px;
    }
    .product-select-check {
      width: 20px; height: 20px; border-radius: 50%;
      background: #58C65D; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; opacity: 0; transition: opacity 0.15s;
    }
    .product-select-item.selected .product-select-check { opacity: 1; }
    .product-select-foot {
      padding: 14px 24px; border-top: 1px solid #E5E7EA;
      display: flex; justify-content: flex-end; gap: 8px;
    }
    .btn-overlay-cancel {
      height: 36px; padding: 0 16px;
      border: 1px solid #E5E7EA; border-radius: 8px;
      background: #fff; font-size: 13px; color: #596066; cursor: pointer;
    }
    .btn-overlay-confirm {
      height: 36px; padding: 0 20px;
      border: none; border-radius: 8px;
      background: #58C65D; font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-overlay-confirm:hover { background: #4ab54f; }
    .btn-overlay-confirm:disabled { background: #C1E9C3; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- ── 프로덕트 선택 오버레이 ── -->
<div class="product-select-overlay" id="productSelectOverlay">
  <div class="product-select-modal">
    <div class="product-select-head">
      <h2>프로덕트 편성표</h2>
      <p>편성표를 확인할 프로덕트를 선택해 주세요.</p>
    </div>
    <div class="product-select-search">
      <input type="text" id="productSearchInput" placeholder="프로덕트명으로 검색..." oninput="filterProducts(this.value)">
    </div>
    <div class="product-select-list" id="productSelectList"></div>
    <div class="product-select-foot">
      <button class="btn-overlay-cancel" onclick="closeProductSelect()">취소</button>
      <button class="btn-overlay-confirm" id="btnConfirmProduct" onclick="confirmProductSelect()" disabled>편성표 보기</button>
    </div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-search">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="#9EA5AD" stroke-width="1.5"/><path d="M11 11l3 3" stroke="#9EA5AD" stroke-width="1.5" stroke-linecap="round"/></svg>

      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2a5 5 0 015 5c0 3 1.5 4.5 2 5H2c.5-.5 2-2 2-5a5 5 0 015-5z" stroke="#9EA5AD" stroke-width="1.4"/><path d="M7.5 16h3" stroke="#9EA5AD" stroke-width="1.4" stroke-linecap="round"/></svg>

<main class="content">
  <div class="content-inner">

    <div class="bcrumb">
      <span>편성표</span><span class="bcrumb-sep">›</span>
      <a href="schedule-product-month.html">프로덕트 편성표</a><span class="bcrumb-sep">›</span>
      <span class="bcrumb-current" id="bcrumbProduct">프로덕트 선택</span>
    </div>

    <div class="page-grid">

      <!-- LEFT: Calendar -->

function dateKey(y, m, d) {
  return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}

/* 해당 날짜의 최대 상태(가장 심각한 status) → status bar 색 */
function dominantStatus(scheds) {
  if (!scheds || !scheds.length) return null;
  var rank = { red:4, orange:3, amber:2, green:1, blue:0 };
  return scheds.reduce(function(a, b) { return (rank[b.status] || 0) > (rank[a.status] || 0) ? b : a; }).status;
}

function renderCalendar() {
  var body = document.getElementById('calBody');
  if (!body) return;

  var firstDay = new Date(CAL_YEAR, CAL_MONTH - 1, 1).getDay(); // 0=sun
  var daysInMonth = new Date(CAL_YEAR, CAL_MONTH, 0).getDate();
  var prevDays = new Date(CAL_YEAR, CAL_MONTH - 1, 0).getDate();
  var today = new Date();
  var todayKey = dateKey(today.getFullYear(), today.getMonth()+1, today.getDate());

  var cells = '';
  var MAX_CHIPS = 3;

  /* prev month padding */
  for (var i = firstDay - 1; i >= 0; i--) {
    cells += '<div class="cal-cell other-month weekend">' +
      '<div class="cal-cell-head"><span class="cal-date-num">' + (prevDays - i) + '</span></div>' +
    '</div>';
  }

  for (var d = 1; d <= daysInMonth; d++) {
    var key = dateKey(CAL_YEAR, CAL_MONTH, d);
    var dow = new Date(CAL_YEAR, CAL_MONTH - 1, d).getDay();
    var isSun = dow === 0, isSat = dow === 6;
    var isToday = key === todayKey;
    var isSelected = key === selectedDate;
    var scheds = DAY_SCHEDULES[key] || [];
    var status = dominantStatus(scheds);

    var cls = 'cal-cell';
    if (isSun || isSat) cls += ' weekend';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    var dateNumCls = 'cal-date-num' + (isSun ? ' sunday' : isSat ? ' saturday' : '');

    /* 상태 바 */
    var statusBar = status
      ? '<div class="cal-status-bar status-' + status + '" style="flex:1;height:4px;border-radius:3px;"></div>'
      : '<div style="flex:1;"></div>';

    /* 칩 목록 */
    var chips = '';
    var show = Math.min(scheds.length, MAX_CHIPS);
    for (var s = 0; s < show; s++) {
      chips += '<div class="cal-schedule-chip ' + scheds[s].cls + '">' + scheds[s].name + '</div>';
    }
    if (scheds.length > MAX_CHIPS) {
      chips += '<div class="cal-more-chip">+' + (scheds.length - MAX_CHIPS) + '개 더</div>';
    }

    cells +=
      '<div class="' + cls + '">' +
        '<div class="cal-cell-head">' +
          '<a href="schedule-product-day.html" class="cal-date-link" onclick="event.stopPropagation()">' +
            '<span class="' + dateNumCls + '">' + d + '</span>' +
          '</a>' +
          statusBar +
        '</div>' +
        '<div class="cal-cell-body" onclick="openBookingModal(\'' + key + '\')">' +
          chips +
        '</div>' +
      '</div>';
  }

  /* next month padding */
  var total = firstDay + daysInMonth;
  var remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (var n = 1; n <= remaining; n++) {
    cells += '<div class="cal-cell other-month">' +
      '<div class="cal-cell-head"><span class="cal-date-num">' + n + '</span></div>' +
    '</div>';
  }

  body.innerHTML = cells;
}

  document.getElementById('scheduleList').innerHTML = list.map(function(s) {
    var typeHtml = s.type === '조건'
      ? '<span class="tag-condition"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1.5a3.5 3.5 0 100 7 3.5 3.5 0 000-7z" stroke="currentColor" stroke-width="1.2"/><path d="M5 3v2.5l1.5 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>조건</span>'
      : s.type;
    return '<a href="schedule-product-day.html" class="schedule-card">' +
      '<div class="schedule-card-top">' +
        '<span class="schedule-card-name">' + s.name + '</span>' +
        '<span class="badge ' + s.badge + '"><span class="badge-dot"></span>' + s.badgeTxt + '</span>' +
      '</div>' +
      '<div class="schedule-card-meta">' +
        '<span>' + s.slot + '</span><span class="sep">·</span>' +
        '<span>' + s.sec + '</span><span class="sep">·</span>' +
        '<span>' + typeHtml + '</span>' +
      '</div>' +
      '<div class="schedule-card-advertiser">' + s.advertiser + '</div>' +
    '</a>';
  }).join('');
}

/* ── 예약 모달 ── */
function openBookingModal(key) {
  selectedDate = key;
  renderCalendar(); // 선택 셀 하이라이트

  var parts = key.split('-');
  var dateLabel = parts[0] + '년 ' + parseInt(parts[1]) + '월 ' + parseInt(parts[2]) + '일';
  document.getElementById('bookingModalTitle').textContent = '스케줄 예약';
  document.getElementById('bookingModalDate').textContent = dateLabel;

  /* 당일 스케줄 목록 */
  var scheds = DAY_SCHEDULES[key] || [];
  var el = document.getElementById('bookingDaySchedules');
  if (!scheds.length) {
    el.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#9EA5AD;">운영 예정 스케줄 없음</div>';
  } else {
    el.innerHTML = '<div class="booking-day-schedules-head">운영 예정 ' + scheds.length + '개</div>' +
      scheds.map(function(s) {
        return '<div class="booking-day-sched-item">' +
          '<div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + ({green:'#10B981',amber:'#F59E0B',orange:'#F97316',red:'#EF4444',blue:'#60A5FA'}[s.status]||'#CED2D6') + '"></div>' +
          '<span>' + s.name + '</span>' +
        '</div>';
      }).join('');
  }

  renderScheduleList(key);
  document.getElementById('bookingOverlay').classList.remove('hidden');
}

function closeBookingModal() {
  document.getElementById('bookingOverlay').classList.add('hidden');
}

function submitBooking() {
  var sched = document.getElementById('bookingSchedSelect').value;
  if (!sched) { alert('스케줄을 선택해 주세요.'); return; }
  var btn = document.querySelector('.btn-bk-submit');
  btn.textContent = '등록됨 ✓';
  btn.style.background = '#5DCAA5';
  setTimeout(function() {
    closeBookingModal();
    btn.textContent = '예약 등록';
    btn.style.background = '#58C65D';
  }, 1200);
}

/* 오버레이 바깥 클릭 닫기 */
document.getElementById('bookingOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeBookingModal();
});

/* ── 오늘 날짜로 초기 렌더 ── */
renderCalendar();
renderScheduleList(null);

/* selected 셀 CSS 추가 */
var styleEl = document.createElement('style');
styleEl.textContent = '.cal-cell.selected .cal-cell-body { background: rgba(88,198,93,.06); } .cal-cell.selected { outline: 2px solid #58C65D; outline-offset: -2px; }';
document.head.appendChild(styleEl);
</script>
</body>

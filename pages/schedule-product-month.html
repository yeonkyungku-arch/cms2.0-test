<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>편성표 · 프로덕트 월간 — D'ooh CMS</title>
  <link rel="stylesheet" href="../assets/css/cms.css">
  <style>
    /* ── 탭 ── */
    .view-tabs {
      display: flex;
      border: 1px solid #CED2D6;
      border-radius: 6px;
      overflow: hidden;
    }
    .view-tabs a {
      display: flex; align-items: center;
      height: 34px; padding: 0 16px;
      font-size: 13px; font-weight: 500; color: #596066;
      background: #fff; text-decoration: none;
      transition: all 0.2s;
    }
    .view-tabs a + a { border-left: 1px solid #CED2D6; }
    .view-tabs a.active { background: #F6F7F9; color: #24292E; font-weight: 600; }

    /* ── 컨트롤 바 ── */
    .sched-controls {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid #E5E7EA;
      flex-wrap: wrap;
    }
    .sched-controls-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .product-select {
      height: 34px; padding: 0 12px;
      border: 1px solid #CED2D6; border-radius: 4px;
      background: #fff; font-size: 14px; color: #24292E;
      font-family: inherit; cursor: pointer; outline: none; min-width: 200px;
    }
    .product-select:focus { border-color: #58C65D; }

    /* ── 월 네비게이션 ── */
    .month-nav {
      display: flex; align-items: center; gap: 0;
      border: 1px solid #CED2D6; border-radius: 4px; overflow: hidden;
    }
    .month-nav button {
      width: 32px; height: 32px;
      border: none; background: #fff;
      color: #596066; cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .month-nav button:hover { background: #F6F7F9; }
    .month-nav span {
      padding: 0 14px;
      font-size: 14px; font-weight: 600; color: #24292E;
      border-left: 1px solid #CED2D6;
      border-right: 1px solid #CED2D6;
      line-height: 32px; white-space: nowrap;
    }

    /* ── 달력 ── */
    .cal-wrap { padding: 0; overflow-x: auto; }
    .cal-table {
      width: 100%; border-collapse: collapse;
      table-layout: fixed;
    }
    .cal-table .dow-row th {
      font-size: 12px; font-weight: 600; color: #9EA5AD;
      text-align: center; padding: 10px 0;
      background: #FAFAFA; border-bottom: 1px solid #E5E7EA;
    }
    .cal-table .dow-row th:first-child { color: #E5534B; } /* 일 */
    .cal-table .dow-row th:last-child  { color: #2D84ED; } /* 토 */

    .cal-cell {
      vertical-align: top;
      border: 1px solid #E5E7EA;
      min-height: 110px; height: 110px;
      padding: 6px 8px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
      user-select: none;
    }
    .cal-cell:hover { background: #F6F7F9; }
    .cal-cell:hover .cell-add { opacity: 1; }
    .cal-cell.today { background: #F0FFF1; }
    .cal-cell.today .cell-date { color: #58C65D; font-weight: 700; }
    .cal-cell.other-month .cell-date { color: #CED2D6; }
    .cal-cell.other-month { background: #FAFAFA; }
    .cal-cell.drag-over { background: #EBF4FF; }
    .cal-cell.drag-start { background: #DBEEFF; }
    .cal-cell.drag-end   { background: #DBEEFF; }

    .cell-date {
      font-size: 13px; font-weight: 600; color: #24292E;
      margin-bottom: 5px;
    }
    .cell-add {
      position: absolute; top: 6px; right: 8px;
      width: 18px; height: 18px;
      background: #58C65D; color: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      opacity: 0; transition: opacity 0.15s;
      cursor: pointer; z-index: 1;
    }

    .cell-chips { display: flex; flex-direction: column; gap: 3px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500;
      padding: 2px 7px; border-radius: 10px;
      width: fit-content;
    }
    .chip-confirmed { background: #E8F8E9; color: #2E9E34; }
    .chip-draft     { background: #FFF6E0; color: #B97B00; border: 1px dashed #F0C44A; }
    .chip-booking   { background: #EAF2FF; color: #2D84ED; }

    /* ── 범례 ── */
    .legend {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px;
      border-top: 1px solid #E5E7EA;
      font-size: 12px; color: #596066;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 2px;
    }
  </style>
</head>

<div id="bookingModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:500; align-items:center; justify-content:center;">
  <div style="background:#fff; border-radius:8px; width:420px; padding:24px; box-shadow:0 8px 32px rgba(0,0,0,0.18);">

    <div style="display:flex; flex-direction:column; gap:14px;">

          <span style="color:#9EA5AD;">~</span>
          <input id="bookEnd" type="text" value="2025.10.31" style="flex:1; height:36px; border:1px solid #CED2D6; border-radius:4px; padding:0 10px; font-size:14px; font-family:inherit; outline:none;">
        </div>
      </div>

        <label style="font-size:12px; color:#596066; font-weight:600; display:block; margin-bottom:5px;">재생 시간 <span style="color:#E5534B;">*</span></label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" placeholder="0" min="1" style="width:100px; height:36px; border:1px solid #CED2D6; border-radius:4px; padding:0 10px; font-size:14px; font-family:inherit; outline:none;">
          <span style="font-size:14px; color:#596066;">초</span>
        </div>
      </div>
      <div>
        <label style="font-size:12px; color:#596066; font-weight:600; display:block; margin-bottom:5px;">보장 횟수 <span style="color:#E5534B;">*</span></label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" placeholder="0" min="1" style="width:100px; height:36px; border:1px solid #CED2D6; border-radius:4px; padding:0 10px; font-size:14px; font-family:inherit; outline:none;">
          <span style="font-size:14px; color:#596066;">회</span>
        </div>
      </div>
      <div>
        <label style="font-size:12px; color:#596066; font-weight:600; display:block; margin-bottom:5px;">메모</label>
        <textarea placeholder="메모를 입력하세요 (선택)" rows="3" style="width:100%; border:1px solid #CED2D6; border-radius:4px; padding:8px 10px; font-size:14px; font-family:inherit; outline:none; resize:vertical; box-sizing:border-box;"></textarea>
      </div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
      <button onclick="closeModal()" class="btn btn-ghost">취소</button>
      <button class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script>
  /* ── 달력 렌더링 ── */
  const DATA = {
    // date(1-based) → { confirmed, draft, booking }
    1:  { confirmed:2, draft:0, booking:1 },
    2:  { confirmed:1, draft:1, booking:0 },
    3:  { confirmed:0, draft:0, booking:2 },
    6:  { confirmed:3, draft:1, booking:0 },
    7:  { confirmed:2, draft:0, booking:1 },
    8:  { confirmed:1, draft:2, booking:0 },
    13: { confirmed:2, draft:1, booking:1 },
    14: { confirmed:0, draft:3, booking:0 },
    15: { confirmed:2, draft:0, booking:1 },
    20: { confirmed:1, draft:1, booking:2 },
    21: { confirmed:3, draft:0, booking:0 },
    27: { confirmed:2, draft:1, booking:1 },
    28: { confirmed:1, draft:0, booking:0 },
  };

  const TODAY = 15; // 오늘 날짜 (데모)
  const YEAR = 2025, MONTH = 9; // 0-indexed: 10월

  function renderCal() {
    const firstDay = new Date(YEAR, MONTH, 1).getDay(); // 0=일
    const lastDate = new Date(YEAR, MONTH + 1, 0).getDate();
    const prevLast = new Date(YEAR, MONTH, 0).getDate();

    const body = document.getElementById('calBody');
    let html = '';
    let day = 1;
    let nextDay = 1;
    let cell = 0;

    const totalCells = Math.ceil((firstDay + lastDate) / 7) * 7;

    for (let i = 0; i < totalCells; i += 7) {
      html += '<tr>';
      for (let j = 0; j < 7; j++) {
        const idx = i + j;
        let dateNum, isOther = false, isSun = j === 0, isSat = j === 6;
        if (idx < firstDay) {
          dateNum = prevLast - firstDay + idx + 1;
          isOther = true;
        } else if (day > lastDate) {
          dateNum = nextDay++;
          isOther = true;
        } else {
          dateNum = day++;
        }

        const isToday = !isOther && dateNum === TODAY;
        const d = !isOther ? DATA[dateNum] : null;

        let cls = 'cal-cell';
        if (isOther) cls += ' other-month';
        if (isToday) cls += ' today';

        let chips = '';
        if (d) {
          if (d.confirmed > 0) chips += `<span class="chip chip-confirmed">확정 ${d.confirmed}</span>`;
          if (d.draft > 0)     chips += `<span class="chip chip-draft">초안 ${d.draft}</span>`;
          if (d.booking > 0)   chips += `<span class="chip chip-booking">Booking ${d.booking}</span>`;
        }

        const dateColor = isSun ? 'color:#E5534B;' : isSat ? 'color:#2D84ED;' : '';

        html += `
          <td class="${cls}" onclick="openModalForDate(${dateNum}, ${isOther})"
              onmousedown="startDrag(${dateNum}, ${isOther})"
              onmouseenter="onDragEnter(${dateNum}, ${isOther})"
              onmouseup="endDrag(${dateNum}, ${isOther})"
              data-date="${dateNum}" data-other="${isOther}">
            <div class="cell-date" style="${dateColor}">${dateNum}</div>
            <div class="cell-chips">${chips}</div>
            <div class="cell-add" onclick="event.stopPropagation(); openModalForDate(${dateNum}, ${isOther})">+</div>
          </td>`;
      }
      html += '</tr>';
    }
    body.innerHTML = html;
  }

  /* ── 드래그 선택 ── */
  let isDragging = false, dragFrom = null, dragTo = null;

  function startDrag(d, other) {
    if (other) return;
    isDragging = true;
    dragFrom = d;
    dragTo = d;
    updateDragHighlight();
  }
  function onDragEnter(d, other) {
    if (!isDragging || other) return;
    dragTo = d;
    updateDragHighlight();
  }
  function endDrag(d, other) {
    if (!isDragging) return;
    isDragging = false;
    const from = Math.min(dragFrom, dragTo);
    const to   = Math.max(dragFrom, dragTo);
    if (from !== to) {
      openModalForRange(from, to);
    }
    dragFrom = null; dragTo = null;
    updateDragHighlight();
  }
  function updateDragHighlight() {
    document.querySelectorAll('.cal-cell').forEach(el => {
      el.classList.remove('drag-over', 'drag-start', 'drag-end');
      if (!isDragging || !dragFrom) return;
      const d = parseInt(el.dataset.date);
      const other = el.dataset.other === 'true';
      if (other) return;
      const from = Math.min(dragFrom, dragTo);
      const to   = Math.max(dragFrom, dragTo);
      if (d === from) el.classList.add('drag-start');
      else if (d === to) el.classList.add('drag-end');
      else if (d > from && d < to) el.classList.add('drag-over');
    });
  }
  document.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; dragFrom = null; dragTo = null; updateDragHighlight(); }
  });

  /* ── 팝업 ── */
  function openModalForDate(d, other) {
    if (other) return;
    document.getElementById('bookStart').value = `2025.10.${String(d).padStart(2,'0')}`;
    document.getElementById('bookEnd').value   = `2025.10.${String(d).padStart(2,'0')}`;
    document.getElementById('bookingModal').style.display = 'flex';
  }
  function openModalForRange(from, to) {
    document.getElementById('bookStart').value = `2025.10.${String(from).padStart(2,'0')}`;
    document.getElementById('bookEnd').value   = `2025.10.${String(to).padStart(2,'0')}`;
    document.getElementById('bookingModal').style.display = 'flex';
  }
  function closeModal() {
    document.getElementById('bookingModal').style.display = 'none';
  }
  document.getElementById('bookingModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  renderCal();
</script>
</body>
